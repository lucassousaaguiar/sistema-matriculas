<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto">
      <path d="M1,1 L16,8 L1,15 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="795" text-anchor="middle" font-size="11" fill="#555555">Diagrama de Classes v1 — Sistema de Matrículas (Lab02S02)</text>

  <!-- ============ Usuario (abstrata) ============ -->
  <g>
    <rect x="300" y="30" width="200" height="100" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="300" y1="54" x2="500" y2="54" stroke="#000000" stroke-width="1"/>
    <line x1="300" y1="102" x2="500" y2="102" stroke="#000000" stroke-width="1"/>
    <text x="400" y="47" text-anchor="middle" font-size="11" font-weight="bold" font-style="italic">Usuario</text>
    <text x="308" y="68" font-size="9.5">- login: String</text>
    <text x="308" y="82" font-size="9.5">- senhaHash: String</text>
    <text x="308" y="96" font-size="9.5">- nome: String</text>
    <text x="308" y="118" font-size="9.5">+ autenticar(senha: String): boolean</text>
  </g>

  <!-- Generalização: tronco ortogonal -->
  <g stroke="#000000" stroke-width="1.2" fill="none">
    <line x1="400" y1="190" x2="400" y2="134" marker-end="url(#tri)"/>
    <line x1="165" y1="190" x2="665" y2="190"/>
    <line x1="165" y1="190" x2="165" y2="225"/>
    <line x1="410" y1="190" x2="410" y2="225"/>
    <line x1="665" y1="190" x2="665" y2="225"/>
  </g>

  <!-- ============ Aluno ============ -->
  <g>
    <rect x="60" y="225" width="210" height="100" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="60" y1="249" x2="270" y2="249" stroke="#000000" stroke-width="1"/>
    <line x1="60" y1="271" x2="270" y2="271" stroke="#000000" stroke-width="1"/>
    <text x="165" y="242" text-anchor="middle" font-size="11" font-weight="bold">Aluno</text>
    <text x="68" y="263" font-size="9.5">- matriculaAcad: String</text>
    <text x="68" y="285" font-size="9.5">+ matricular(d, tipo): boolean</text>
    <text x="68" y="299" font-size="9.5">+ cancelarMatricula(d): void</text>
    <text x="68" y="313" font-size="9.5">+ getMatriculas(): List&lt;Matricula&gt;</text>
  </g>

  <!-- ============ Professor ============ -->
  <g>
    <rect x="310" y="225" width="200" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="310" y1="249" x2="510" y2="249" stroke="#000000" stroke-width="1"/>
    <line x1="310" y1="259" x2="510" y2="259" stroke="#000000" stroke-width="1"/>
    <text x="410" y="242" text-anchor="middle" font-size="11" font-weight="bold">Professor</text>
    <text x="318" y="275" font-size="9.5">+ listarAlunos(d): List&lt;Aluno&gt;</text>
  </g>

  <!-- ============ Secretaria ============ -->
  <g>
    <rect x="550" y="225" width="230" height="112" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="550" y1="249" x2="780" y2="249" stroke="#000000" stroke-width="1"/>
    <line x1="550" y1="259" x2="780" y2="259" stroke="#000000" stroke-width="1"/>
    <text x="665" y="242" text-anchor="middle" font-size="11" font-weight="bold">Secretaria</text>
    <text x="558" y="275" font-size="9.5">+ gerarCurriculo(semestre): Curriculo</text>
    <text x="558" y="289" font-size="9.5">+ manterDisciplinas(): void</text>
    <text x="558" y="303" font-size="9.5">+ manterProfessores(): void</text>
    <text x="558" y="317" font-size="9.5">+ manterAlunos(): void</text>
    <text x="558" y="331" font-size="9.5">+ encerrarPeriodo(c: Curriculo): void</text>
  </g>

  <!-- ============ Curso ============ -->
  <g>
    <rect x="60" y="430" width="200" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="60" y1="454" x2="260" y2="454" stroke="#000000" stroke-width="1"/>
    <line x1="60" y1="492" x2="260" y2="492" stroke="#000000" stroke-width="1"/>
    <text x="160" y="447" text-anchor="middle" font-size="11" font-weight="bold">Curso</text>
    <text x="68" y="468" font-size="9.5">- nome: String</text>
    <text x="68" y="482" font-size="9.5">- creditos: int</text>
  </g>

  <!-- ============ Disciplina ============ -->
  <g>
    <rect x="320" y="420" width="240" height="166" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="320" y1="444" x2="560" y2="444" stroke="#000000" stroke-width="1"/>
    <line x1="320" y1="536" x2="560" y2="536" stroke="#000000" stroke-width="1"/>
    <text x="440" y="437" text-anchor="middle" font-size="11" font-weight="bold">Disciplina</text>
    <text x="328" y="458" font-size="9.5">- codigo: String</text>
    <text x="328" y="472" font-size="9.5">- nome: String</text>
    <text x="328" y="486" font-size="9.5">- creditos: int</text>
    <text x="328" y="500" font-size="9.5">- ativa: boolean</text>
    <text x="328" y="514" font-size="9.5">- MAX_ALUNOS: int = 60</text>
    <text x="328" y="528" font-size="9.5">- MIN_ALUNOS: int = 3</text>
    <text x="328" y="550" font-size="9.5">+ temVaga(): boolean</text>
    <text x="328" y="564" font-size="9.5">+ qtdMatriculados(): int</text>
    <text x="328" y="578" font-size="9.5">+ verificarAtivacao(): void</text>
  </g>

  <!-- ============ Curriculo ============ -->
  <g>
    <rect x="620" y="430" width="230" height="96" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="620" y1="454" x2="850" y2="454" stroke="#000000" stroke-width="1"/>
    <line x1="620" y1="504" x2="850" y2="504" stroke="#000000" stroke-width="1"/>
    <text x="735" y="447" text-anchor="middle" font-size="11" font-weight="bold">Curriculo</text>
    <text x="628" y="468" font-size="9.5">- semestre: String</text>
    <text x="628" y="482" font-size="9.5">- inicioMatriculas: LocalDate</text>
    <text x="628" y="496" font-size="9.5">- fimMatriculas: LocalDate</text>
    <text x="628" y="518" font-size="9.5">+ periodoAberto(): boolean</text>
  </g>

  <!-- ============ TipoMatricula (enum) ============ -->
  <g>
    <rect x="40" y="650" width="150" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="40" y1="684" x2="190" y2="684" stroke="#000000" stroke-width="1"/>
    <text x="115" y="664" text-anchor="middle" font-size="9" font-style="italic">«enumeration»</text>
    <text x="115" y="678" text-anchor="middle" font-size="11" font-weight="bold">TipoMatricula</text>
    <text x="48" y="698" font-size="9.5">OBRIGATORIA</text>
    <text x="48" y="712" font-size="9.5">OPTATIVA</text>
  </g>

  <!-- ============ Matricula ============ -->
  <g>
    <rect x="230" y="650" width="210" height="84" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="230" y1="674" x2="440" y2="674" stroke="#000000" stroke-width="1"/>
    <line x1="230" y1="712" x2="440" y2="712" stroke="#000000" stroke-width="1"/>
    <text x="335" y="667" text-anchor="middle" font-size="11" font-weight="bold">Matricula</text>
    <text x="238" y="688" font-size="9.5">- tipo: TipoMatricula</text>
    <text x="238" y="702" font-size="9.5">- data: LocalDate</text>
    <text x="238" y="726" font-size="9.5">+ cancelar(): void</text>
  </g>

  <!-- ============ SistemaMatriculas ============ -->
  <g>
    <rect x="620" y="610" width="250" height="100" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="620" y1="634" x2="870" y2="634" stroke="#000000" stroke-width="1"/>
    <line x1="620" y1="644" x2="870" y2="644" stroke="#000000" stroke-width="1"/>
    <text x="745" y="627" text-anchor="middle" font-size="11" font-weight="bold">SistemaMatriculas</text>
    <text x="628" y="660" font-size="9.5">+ login(login, senha): Usuario</text>
    <text x="628" y="674" font-size="9.5">+ matricular(a, d, tipo): boolean</text>
    <text x="628" y="688" font-size="9.5">+ cancelarMatricula(a, d): void</text>
    <text x="628" y="702" font-size="9.5">+ encerrarPeriodo(): void</text>
  </g>

  <!-- ============ SistemaCobrancas (interface) ============ -->
  <g>
    <rect x="930" y="430" width="230" height="62" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="930" y1="464" x2="1160" y2="464" stroke="#000000" stroke-width="1"/>
    <text x="1045" y="444" text-anchor="middle" font-size="9" font-style="italic">«interface»</text>
    <text x="1045" y="458" text-anchor="middle" font-size="11" font-weight="bold">SistemaCobrancas</text>
    <text x="938" y="480" font-size="9.5">+ notificarMatricula(m: Matricula): void</text>
  </g>

  <!-- ============ RepositorioDados ============ -->
  <g>
    <rect x="930" y="610" width="230" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="930" y1="634" x2="1160" y2="634" stroke="#000000" stroke-width="1"/>
    <line x1="930" y1="644" x2="1160" y2="644" stroke="#000000" stroke-width="1"/>
    <text x="1045" y="627" text-anchor="middle" font-size="11" font-weight="bold">RepositorioDados</text>
    <text x="938" y="660" font-size="9.5">+ salvar(): void</text>
    <text x="938" y="674" font-size="9.5">+ carregar(): void</text>
  </g>
  <text x="1045" y="702" text-anchor="middle" font-size="8.5" fill="#555555">persistência em arquivos (RNF03)</text>

  <!-- ============ Associações ============ -->
  <g fill="none" stroke="#000000" stroke-width="1.1">
    <!-- Aluno 1 — 0..6 Matricula (contorna Curso e TipoMatricula pela margem esquerda) -->
    <polyline points="60,310 30,310 30,760 335,760 335,734"/>
    <!-- Matricula 0..60 — 1 Disciplina -->
    <polyline points="440,690 470,690 470,586"/>
    <!-- Curso agrega Disciplina -->
    <line x1="284" y1="466" x2="320" y2="466"/>
    <!-- Professor 1 — 0..* Disciplina -->
    <line x1="410" y1="289" x2="410" y2="420"/>
    <!-- Curriculo 0..1 — 1..* Disciplina -->
    <line x1="620" y1="470" x2="560" y2="470"/>
    <!-- Secretaria 1 — 0..* Curriculo -->
    <polyline points="665,337 665,390 735,390 735,430"/>
  </g>
  <!-- diamante de agregação no lado Curso -->
  <polygon points="260,466 272,461 284,466 272,471" fill="#ffffff" stroke="#000000" stroke-width="1.1"/>

  <!-- multiplicidades e rótulos -->
  <text x="38" y="326" font-size="9">1</text>
  <text x="344" y="752" font-size="9">0..6</text>
  <text x="446" y="684" font-size="9">0..60</text>
  <text x="475" y="600" font-size="9">1</text>
  <text x="298" y="460" font-size="9">1..*</text>
  <text x="290" y="480" font-size="9">1</text>
  <text x="290" y="452" font-size="8.5" fill="#555555" text-anchor="end">é composto por</text>
  <text x="416" y="305" font-size="9">1</text>
  <text x="416" y="414" font-size="9">0..*</text>
  <text x="420" y="356" font-size="8.5" fill="#555555">leciona</text>
  <text x="566" y="463" font-size="9">1..*</text>
  <text x="597" y="463" font-size="9">0..1</text>
  <text x="590" y="485" font-size="8.5" fill="#555555">oferta</text>
  <text x="672" y="352" font-size="9">1</text>
  <text x="742" y="424" font-size="9">0..*</text>
  <text x="700" y="384" font-size="8.5" fill="#555555">gera</text>

  <!-- ============ Dependências «use» ============ -->
  <g fill="none" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4">
    <polyline points="745,610 745,545 1045,545 1045,492" marker-end="url(#open)"/>
    <line x1="870" y1="680" x2="926" y2="658" marker-end="url(#open)"/>
  </g>
  <text x="900" y="538" font-size="9" font-style="italic">«use»</text>
  <text x="894" y="684" font-size="9" font-style="italic">«use»</text>
</svg>
