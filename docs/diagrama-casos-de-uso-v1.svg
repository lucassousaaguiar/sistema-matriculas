<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M1,1 L14,7 L1,13 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="790" fill="#ffffff"/>

  <!-- ===== Fronteira do sistema ===== -->
  <rect x="350" y="15" width="580" height="745" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="640" y="42" text-anchor="middle" font-size="13" font-weight="bold">Sistema de Matrículas</text>

  <!-- ===== Ator pai: Usuário ===== -->
  <g stroke="#000000" stroke-width="1.6" fill="none">
    <circle cx="120" cy="45" r="9" fill="#ffffff"/>
    <line x1="120" y1="54" x2="120" y2="83"/>
    <line x1="105" y1="64" x2="135" y2="64"/>
    <line x1="120" y1="83" x2="107" y2="103"/>
    <line x1="120" y1="83" x2="133" y2="103"/>
  </g>
  <text x="120" y="119" text-anchor="middle" font-size="11.5" font-weight="bold">Usuário</text>
  <text x="120" y="131" text-anchor="middle" font-size="7.8" fill="#333333">possui login e senha</text>

  <!-- ===== Generalização (tronco ortogonal, triângulo no pai) ===== -->
  <g stroke="#000000" stroke-width="1.2" fill="none">
    <line x1="120" y1="448" x2="120" y2="140" marker-end="url(#tri)"/>
    <line x1="120" y1="198" x2="174" y2="198"/>
    <line x1="120" y1="323" x2="174" y2="323"/>
    <line x1="120" y1="448" x2="174" y2="448"/>
  </g>

  <!-- ===== Ator: Aluno ===== -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="190" cy="180" r="8" fill="#ffffff"/>
    <line x1="190" y1="188" x2="190" y2="214"/>
    <line x1="177" y1="197" x2="203" y2="197"/>
    <line x1="190" y1="214" x2="179" y2="232"/>
    <line x1="190" y1="214" x2="201" y2="232"/>
  </g>
  <text x="190" y="248" text-anchor="middle" font-size="10" font-weight="bold">Aluno</text>
  <text x="190" y="260" text-anchor="middle" font-size="7.8" fill="#333333">matricula-se em disciplinas</text>
  <text x="190" y="270" text-anchor="middle" font-size="7.8" fill="#333333">e cancela matrículas</text>

  <!-- ===== Ator: Professor ===== -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="190" cy="305" r="8" fill="#ffffff"/>
    <line x1="190" y1="313" x2="190" y2="339"/>
    <line x1="177" y1="322" x2="203" y2="322"/>
    <line x1="190" y1="339" x2="179" y2="357"/>
    <line x1="190" y1="339" x2="201" y2="357"/>
  </g>
  <text x="190" y="373" text-anchor="middle" font-size="10" font-weight="bold">Professor</text>
  <text x="190" y="385" text-anchor="middle" font-size="7.8" fill="#333333">consulta os alunos de</text>
  <text x="190" y="395" text-anchor="middle" font-size="7.8" fill="#333333">suas disciplinas</text>

  <!-- ===== Ator: Secretaria ===== -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="190" cy="430" r="8" fill="#ffffff"/>
    <line x1="190" y1="438" x2="190" y2="464"/>
    <line x1="177" y1="447" x2="203" y2="447"/>
    <line x1="190" y1="464" x2="179" y2="482"/>
    <line x1="190" y1="464" x2="201" y2="482"/>
  </g>
  <text x="190" y="498" text-anchor="middle" font-size="10" font-weight="bold">Secretaria</text>
  <text x="190" y="510" text-anchor="middle" font-size="7.8" fill="#333333">mantém currículo, disciplinas,</text>
  <text x="190" y="520" text-anchor="middle" font-size="7.8" fill="#333333">professores e alunos</text>

  <!-- ===== Ator externo: Sistema de Cobranças ===== -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="1000" cy="152" r="8" fill="#ffffff"/>
    <line x1="1000" y1="160" x2="1000" y2="186"/>
    <line x1="987" y1="169" x2="1013" y2="169"/>
    <line x1="1000" y1="186" x2="989" y2="204"/>
    <line x1="1000" y1="186" x2="1011" y2="204"/>
  </g>
  <text x="1000" y="220" text-anchor="middle" font-size="9" font-style="italic">«sistema externo»</text>
  <text x="1000" y="234" text-anchor="middle" font-size="10" font-weight="bold">Sistema de</text>
  <text x="1000" y="246" text-anchor="middle" font-size="10" font-weight="bold">Cobranças</text>

  <!-- ===== Casos de uso ===== -->
  <g fill="#ffffff" stroke="#000000" stroke-width="1.3">
    <ellipse cx="505" cy="75" rx="105" ry="27"/>
    <ellipse cx="505" cy="180" rx="105" ry="27"/>
    <ellipse cx="505" cy="260" rx="105" ry="27"/>
    <ellipse cx="505" cy="340" rx="105" ry="30"/>
    <ellipse cx="505" cy="430" rx="105" ry="30"/>
    <ellipse cx="505" cy="505" rx="105" ry="27"/>
    <ellipse cx="505" cy="575" rx="105" ry="27"/>
    <ellipse cx="505" cy="645" rx="105" ry="27"/>
    <ellipse cx="505" cy="715" rx="105" ry="30"/>
    <ellipse cx="800" cy="180" rx="100" ry="30"/>
  </g>
  <text x="505" y="71" text-anchor="middle" font-size="10" font-weight="bold">UC01</text>
  <text x="505" y="85" text-anchor="middle" font-size="10">Efetuar login</text>
  <text x="505" y="176" text-anchor="middle" font-size="10" font-weight="bold">UC02</text>
  <text x="505" y="190" text-anchor="middle" font-size="10">Realizar matrícula</text>
  <text x="505" y="256" text-anchor="middle" font-size="10" font-weight="bold">UC03</text>
  <text x="505" y="270" text-anchor="middle" font-size="10">Cancelar matrícula</text>
  <text x="505" y="330" text-anchor="middle" font-size="10" font-weight="bold">UC04</text>
  <text x="505" y="344" text-anchor="middle" font-size="10">Consultar alunos</text>
  <text x="505" y="357" text-anchor="middle" font-size="10">da disciplina</text>
  <text x="505" y="420" text-anchor="middle" font-size="10" font-weight="bold">UC05</text>
  <text x="505" y="434" text-anchor="middle" font-size="10">Gerar currículo</text>
  <text x="505" y="447" text-anchor="middle" font-size="10">do semestre</text>
  <text x="505" y="501" text-anchor="middle" font-size="10" font-weight="bold">UC06</text>
  <text x="505" y="515" text-anchor="middle" font-size="10">Manter disciplinas</text>
  <text x="505" y="571" text-anchor="middle" font-size="10" font-weight="bold">UC07</text>
  <text x="505" y="585" text-anchor="middle" font-size="10">Manter professores</text>
  <text x="505" y="641" text-anchor="middle" font-size="10" font-weight="bold">UC08</text>
  <text x="505" y="655" text-anchor="middle" font-size="10">Manter alunos</text>
  <text x="505" y="705" text-anchor="middle" font-size="10" font-weight="bold">UC09</text>
  <text x="505" y="719" text-anchor="middle" font-size="10">Encerrar período</text>
  <text x="505" y="732" text-anchor="middle" font-size="10">de matrículas</text>
  <text x="800" y="170" text-anchor="middle" font-size="10" font-weight="bold">UC10</text>
  <text x="800" y="184" text-anchor="middle" font-size="10">Notificar sistema</text>
  <text x="800" y="197" text-anchor="middle" font-size="10">de cobranças</text>

  <!-- ===== Associações ===== -->
  <g fill="none" stroke="#000000" stroke-width="1.1">
    <line x1="140" y1="60" x2="400" y2="73"/>
    <line x1="206" y1="200" x2="400" y2="182"/>
    <line x1="206" y1="210" x2="400" y2="255"/>
    <line x1="206" y1="325" x2="400" y2="340"/>
    <line x1="206" y1="445" x2="400" y2="432"/>
    <line x1="206" y1="452" x2="400" y2="500"/>
    <line x1="206" y1="458" x2="400" y2="570"/>
    <line x1="206" y1="463" x2="400" y2="640"/>
    <line x1="206" y1="468" x2="400" y2="708"/>
    <line x1="900" y1="176" x2="988" y2="165"/>
  </g>

  <!-- ===== include ===== -->
  <line x1="610" y1="180" x2="698" y2="180" fill="none" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="654" y="171" text-anchor="middle" font-size="9.5" font-style="italic">«include»</text>
</svg>
