<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="920" viewBox="0 0 1300 920" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto">
      <path d="M1,1 L16,8 L1,15 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="920" fill="#ffffff"/>
  <text x="650" y="905" text-anchor="middle" font-size="11" fill="#555555">Diagrama de Classes v3 — Sistema de Matrículas: introdução de Turma (turmas independentes por disciplina, RN07) e ItemHistorico (histórico do aluno, RF15)</text>

  <!-- ============ Usuario (abstrata) ============ -->
  <g>
    <rect x="300" y="30" width="200" height="100" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="300" y1="54" x2="500" y2="54" stroke="#000000" stroke-width="1"/>
    <line x1="300" y1="102" x2="500" y2="102" stroke="#000000" stroke-width="1"/>
    <text x="400" y="47" text-anchor="middle" font-size="11" font-weight="bold" font-style="italic">Usuario</text>
    <text x="308" y="68" font-size="9.5">- login: String</text>
    <text x="308" y="82" font-size="9.5">- senhaHash: String</text>
    <text x="308" y="96" font-size="9.5">- nome: String</text>
    <text x="308" y="118" font-size="9.5">+ autenticar(senha: String): boolean</text>
  </g>

  <!-- Generalização -->
  <g stroke="#000000" stroke-width="1.2" fill="none">
    <line x1="400" y1="190" x2="400" y2="134" marker-end="url(#tri)"/>
    <line x1="165" y1="190" x2="665" y2="190"/>
    <line x1="165" y1="190" x2="165" y2="225"/>
    <line x1="410" y1="190" x2="410" y2="225"/>
    <line x1="665" y1="190" x2="665" y2="225"/>
  </g>

  <!-- ============ Aluno ============ -->
  <g>
    <rect x="60" y="225" width="210" height="138" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="60" y1="249" x2="270" y2="249" stroke="#000000" stroke-width="1"/>
    <line x1="60" y1="299" x2="270" y2="299" stroke="#000000" stroke-width="1"/>
    <text x="165" y="242" text-anchor="middle" font-size="11" font-weight="bold">Aluno</text>
    <text x="68" y="263" font-size="9.5">- matriculaAcad: String</text>
    <text x="68" y="277" font-size="9.5">- MAX_OBRIGATORIAS: int = 4</text>
    <text x="68" y="291" font-size="9.5">- MAX_OPTATIVAS: int = 2</text>
    <text x="68" y="313" font-size="9.5">+ matricular(t, tipo): boolean</text>
    <text x="68" y="327" font-size="9.5">+ cancelarMatricula(t): void</text>
    <text x="68" y="341" font-size="9.5">+ getMatriculas(): List&lt;Matricula&gt;</text>
    <text x="68" y="355" font-size="9.5">+ getHistorico(): List&lt;ItemHistorico&gt;</text>
  </g>

  <!-- ============ Professor ============ -->
  <g>
    <rect x="310" y="225" width="200" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="310" y1="249" x2="510" y2="249" stroke="#000000" stroke-width="1"/>
    <line x1="310" y1="259" x2="510" y2="259" stroke="#000000" stroke-width="1"/>
    <text x="410" y="242" text-anchor="middle" font-size="11" font-weight="bold">Professor</text>
    <text x="318" y="275" font-size="9.5">+ listarAlunos(t): List&lt;Aluno&gt;</text>
  </g>

  <!-- ============ Secretaria ============ -->
  <g>
    <rect x="550" y="225" width="230" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="550" y1="249" x2="780" y2="249" stroke="#000000" stroke-width="1"/>
    <line x1="550" y1="259" x2="780" y2="259" stroke="#000000" stroke-width="1"/>
    <text x="665" y="242" text-anchor="middle" font-size="11" font-weight="bold">Secretaria</text>
  </g>
  <text x="665" y="287" text-anchor="middle" font-size="8.2" fill="#555555">papel de acesso — operações administrativas</text>
  <text x="665" y="297" text-anchor="middle" font-size="8.2" fill="#555555">executadas pela fachada SistemaMatriculas</text>

  <!-- ============ Curso ============ -->
  <g>
    <rect x="60" y="430" width="200" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="60" y1="454" x2="260" y2="454" stroke="#000000" stroke-width="1"/>
    <line x1="60" y1="492" x2="260" y2="492" stroke="#000000" stroke-width="1"/>
    <text x="160" y="447" text-anchor="middle" font-size="11" font-weight="bold">Curso</text>
    <text x="68" y="468" font-size="9.5">- nome: String</text>
    <text x="68" y="482" font-size="9.5">- creditos: int</text>
  </g>

  <!-- ============ Disciplina ============ -->
  <g>
    <rect x="300" y="420" width="210" height="84" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="300" y1="444" x2="510" y2="444" stroke="#000000" stroke-width="1"/>
    <line x1="300" y1="494" x2="510" y2="494" stroke="#000000" stroke-width="1"/>
    <text x="405" y="437" text-anchor="middle" font-size="11" font-weight="bold">Disciplina</text>
    <text x="308" y="458" font-size="9.5">- codigo: String</text>
    <text x="308" y="472" font-size="9.5">- nome: String</text>
    <text x="308" y="486" font-size="9.5">- creditos: int</text>
  </g>

  <!-- ============ Turma ============ -->
  <g>
    <rect x="560" y="400" width="240" height="138" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="560" y1="424" x2="800" y2="424" stroke="#000000" stroke-width="1"/>
    <line x1="560" y1="488" x2="800" y2="488" stroke="#000000" stroke-width="1"/>
    <text x="680" y="417" text-anchor="middle" font-size="11" font-weight="bold">Turma</text>
    <text x="568" y="438" font-size="9.5">- codigo: String (ex.: T1)</text>
    <text x="568" y="452" font-size="9.5">- ativa: boolean</text>
    <text x="568" y="466" font-size="9.5">- MAX_ALUNOS: int = 60</text>
    <text x="568" y="480" font-size="9.5">- MIN_ALUNOS: int = 3</text>
    <text x="568" y="502" font-size="9.5">+ temVaga(): boolean</text>
    <text x="568" y="516" font-size="9.5">+ qtdMatriculados(): int</text>
    <text x="568" y="530" font-size="9.5">+ verificarAtivacao(): void</text>
  </g>

  <!-- ============ Curriculo ============ -->
  <g>
    <rect x="850" y="420" width="190" height="96" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="850" y1="444" x2="1040" y2="444" stroke="#000000" stroke-width="1"/>
    <line x1="850" y1="494" x2="1040" y2="494" stroke="#000000" stroke-width="1"/>
    <text x="945" y="437" text-anchor="middle" font-size="11" font-weight="bold">Curriculo</text>
    <text x="858" y="458" font-size="9.5">- semestre: String</text>
    <text x="858" y="472" font-size="9.5">- inicioMatriculas: LocalDate</text>
    <text x="858" y="486" font-size="9.5">- fimMatriculas: LocalDate</text>
    <text x="858" y="508" font-size="9.5">+ periodoAberto(): boolean</text>
  </g>

  <!-- ============ TipoMatricula (enum) ============ -->
  <g>
    <rect x="40" y="650" width="150" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="40" y1="684" x2="190" y2="684" stroke="#000000" stroke-width="1"/>
    <text x="115" y="664" text-anchor="middle" font-size="9" font-style="italic">«enumeration»</text>
    <text x="115" y="678" text-anchor="middle" font-size="11" font-weight="bold">TipoMatricula</text>
    <text x="48" y="698" font-size="9.5">OBRIGATORIA</text>
    <text x="48" y="712" font-size="9.5">OPTATIVA</text>
  </g>

  <!-- ============ Matricula ============ -->
  <g>
    <rect x="230" y="640" width="210" height="84" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="230" y1="664" x2="440" y2="664" stroke="#000000" stroke-width="1"/>
    <line x1="230" y1="700" x2="440" y2="700" stroke="#000000" stroke-width="1"/>
    <text x="335" y="657" text-anchor="middle" font-size="11" font-weight="bold">Matricula</text>
    <text x="238" y="678" font-size="9.5">- tipo: TipoMatricula</text>
    <text x="238" y="692" font-size="9.5">- data: LocalDate</text>
    <text x="238" y="714" font-size="9.5">+ cancelar(): void</text>
  </g>

  <!-- ============ ItemHistorico ============ -->
  <g>
    <rect x="300" y="770" width="240" height="84" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="300" y1="794" x2="540" y2="794" stroke="#000000" stroke-width="1"/>
    <line x1="300" y1="844" x2="540" y2="844" stroke="#000000" stroke-width="1"/>
    <text x="420" y="787" text-anchor="middle" font-size="11" font-weight="bold">ItemHistorico</text>
    <text x="308" y="808" font-size="9.5">- disciplina: Disciplina</text>
    <text x="308" y="822" font-size="9.5">- turma: String</text>
    <text x="308" y="836" font-size="9.5">- semestre: String</text>
  </g>

  <!-- ============ SistemaMatriculas ============ -->
  <g>
    <rect x="600" y="600" width="280" height="154" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="600" y1="624" x2="880" y2="624" stroke="#000000" stroke-width="1"/>
    <line x1="600" y1="634" x2="880" y2="634" stroke="#000000" stroke-width="1"/>
    <text x="740" y="617" text-anchor="middle" font-size="11" font-weight="bold">SistemaMatriculas</text>
    <text x="608" y="648" font-size="9.5">+ inicializar(): void</text>
    <text x="608" y="662" font-size="9.5">+ login(login, senha): Usuario</text>
    <text x="608" y="676" font-size="9.5">+ matricular(a, t, tipo): boolean</text>
    <text x="608" y="690" font-size="9.5">+ cancelarMatricula(a, t): boolean</text>
    <text x="608" y="704" font-size="9.5">+ gerarCurriculo(sem, ini, fim, ofertadas): Curriculo</text>
    <text x="608" y="718" font-size="9.5">+ encerrarPeriodo(): void</text>
    <text x="608" y="732" font-size="9.5">+ cadastrarDisciplina/Turma/Aluno/Professor(...)</text>
    <text x="608" y="746" font-size="9.5">+ removerTurma(t) / removerDisciplina(d): boolean</text>
  </g>

  <!-- ============ SistemaCobrancas (interface) ============ -->
  <g>
    <rect x="1060" y="420" width="220" height="62" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="1060" y1="454" x2="1280" y2="454" stroke="#000000" stroke-width="1"/>
    <text x="1170" y="434" text-anchor="middle" font-size="9" font-style="italic">«interface»</text>
    <text x="1170" y="448" text-anchor="middle" font-size="11" font-weight="bold">SistemaCobrancas</text>
    <text x="1068" y="470" font-size="9.5">+ notificarMatricula(m: Matricula): void</text>
  </g>

  <!-- ============ CobrancasArquivo ============ -->
  <g>
    <rect x="1060" y="515" width="220" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="1060" y1="539" x2="1280" y2="539" stroke="#000000" stroke-width="1"/>
    <text x="1170" y="532" text-anchor="middle" font-size="11" font-weight="bold">CobrancasArquivo</text>
    <text x="1068" y="556" font-size="9.5">grava notificações em dados/cobrancas.log</text>
  </g>
  <line x1="1170" y1="515" x2="1170" y2="486" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#tri)"/>

  <!-- ============ RepositorioDados ============ -->
  <g>
    <rect x="1060" y="610" width="220" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="1060" y1="634" x2="1280" y2="634" stroke="#000000" stroke-width="1"/>
    <line x1="1060" y1="644" x2="1280" y2="644" stroke="#000000" stroke-width="1"/>
    <text x="1170" y="627" text-anchor="middle" font-size="11" font-weight="bold">RepositorioDados</text>
    <text x="1068" y="660" font-size="9.5">+ salvar(s: SistemaMatriculas): void</text>
    <text x="1068" y="674" font-size="9.5">+ carregar(s: SistemaMatriculas): boolean</text>
  </g>
  <text x="1170" y="702" text-anchor="middle" font-size="8.5" fill="#555555">persistência em arquivos CSV (RNF03)</text>

  <!-- ============ Main (CLI) ============ -->
  <g>
    <rect x="620" y="790" width="200" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <text x="720" y="806" text-anchor="middle" font-size="9" font-style="italic">«CLI»</text>
    <text x="720" y="820" text-anchor="middle" font-size="11" font-weight="bold">Main</text>
  </g>
  <line x1="720" y1="790" x2="720" y2="758" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="728" y="776" font-size="9" font-style="italic">«use»</text>

  <!-- ============ Associações ============ -->
  <g fill="none" stroke="#000000" stroke-width="1.1">
    <!-- Aluno 1 — 0..6 Matricula -->
    <polyline points="60,335 33,335 33,735 335,735 335,724"/>
    <!-- Aluno 1 — 0..* ItemHistorico -->
    <polyline points="60,352 18,352 18,790 300,790"/>
    <!-- Curso agrega Disciplina -->
    <line x1="284" y1="466" x2="300" y2="466"/>
    <!-- Disciplina 1 — 1..* Turma -->
    <line x1="510" y1="460" x2="560" y2="460"/>
    <!-- Professor 1 — 0..* Turma -->
    <polyline points="410,289 410,360 620,360 620,400"/>
    <!-- Turma 1 — 0..60 Matricula -->
    <polyline points="580,538 580,690 440,690"/>
    <!-- Curriculo 0..1 — 1..* Turma -->
    <line x1="850" y1="470" x2="800" y2="470"/>
    <!-- Secretaria 1 — 0..* Curriculo -->
    <polyline points="665,300 665,385 945,385 945,420"/>
  </g>
  <polygon points="260,466 272,461 284,466 272,471" fill="#ffffff" stroke="#000000" stroke-width="1.1"/>

  <!-- multiplicidades e rótulos -->
  <text x="38" y="330" font-size="9">1</text>
  <text x="344" y="731" font-size="9">0..6</text>
  <text x="22" y="368" font-size="9">1</text>
  <text x="272" y="784" font-size="9">0..*</text>
  <text x="291" y="459" font-size="9">1..*</text>
  <text x="288" y="482" font-size="9">1</text>
  <text x="282" y="452" font-size="8.5" fill="#555555" text-anchor="end">é composto por</text>
  <text x="516" y="454" font-size="9">1</text>
  <text x="538" y="475" font-size="9">1..*</text>
  <text x="416" y="305" font-size="9">1</text>
  <text x="626" y="395" font-size="9">0..*</text>
  <text x="500" y="353" font-size="8.5" fill="#555555">leciona</text>
  <text x="586" y="554" font-size="9">1</text>
  <text x="446" y="684" font-size="9">0..60</text>
  <text x="804" y="462" font-size="9">1..*</text>
  <text x="836" y="462" font-size="9">0..1</text>
  <text x="818" y="486" font-size="8.5" fill="#555555">oferta</text>
  <text x="672" y="315" font-size="9">1</text>
  <text x="951" y="414" font-size="9">0..*</text>
  <text x="800" y="378" font-size="8.5" fill="#555555">gera</text>

  <!-- ============ Dependências «use» ============ -->
  <g fill="none" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4">
    <polyline points="880,612 1050,612 1050,455 1056,455" marker-end="url(#open)"/>
    <line x1="880" y1="650" x2="1056" y2="650" marker-end="url(#open)"/>
  </g>
  <text x="960" y="605" font-size="9" font-style="italic">«use»</text>
  <text x="950" y="643" font-size="9" font-style="italic">«use»</text>
</svg>
